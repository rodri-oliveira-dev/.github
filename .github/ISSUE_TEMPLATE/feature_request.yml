name: Feature request
description: Propose an improvement or new capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem or use case first, then the proposed change. Keep repository-specific constraints in mind.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and Pull Requests for a similar proposal.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What need, limitation, or workflow should this proposal address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or capability you would like to add or change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives or workarounds have you considered?
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and impact
      description: Note possible breaking changes, migration needs, security implications, or operational impact when relevant.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, examples, screenshots, or other useful context without secrets or private data.
    validations:
      required: false
