name: Control plane secret scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # 10:17 America/Sao_Paulo (13:17 UTC), every Thursday.
    - cron: "17 13 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-secret-scan-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Protect control plane
    permissions:
      contents: read
    uses: rodri-oliveira-dev/.github/.github/workflows/reusable-secret-scan.yml@39f63eb623b1a15e62a36474b34ef441bc6cbf28
