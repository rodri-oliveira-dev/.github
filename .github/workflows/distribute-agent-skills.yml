name: Distribute managed agent skills

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/distribute-agent-skills.yml"
      - "agent-governance/manifest.json"
      - "agent-governance/skills/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect consumer drift without creating or updating Pull Requests"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: distribute-managed-agent-skills
  cancel-in-progress: false

jobs:
  distribute:
    name: Update managed skills in consumer repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DOTNET_SDK_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOTNET_SDK_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout canonical governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Distribute existing managed skills
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          CENTRAL_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/automation/distribute-agent-skills.sh"