name: Inventory .NET repositories

on:
  schedule:
    # 09:30 America/Sao_Paulo (12:30 UTC), every Wednesday.
    - cron: "30 12 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-repository-inventory
  cancel-in-progress: false

jobs:
  discovery:
    name: Discover eligible public repositories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted inventory automation without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/automation

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DOTNET_SDK_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOTNET_SDK_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read

      - name: Discover and sanitize eligible repositories
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/automation/dotnet-inventory-discovery.sh"
      - name: Upload sanitized discovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-repository-discovery
          path: ${{ runner.temp }}/dotnet-repository-discovery/repositories.json
          if-no-files-found: error
          retention-days: 1

  inspection:
    name: Inspect discovered public .NET repositories
    needs: discovery
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      INSPECTOR_VERSION: "1.5.2"
      INSPECTOR_SHA: "6524981f737086c1fdb370697e5d4100330f9bc3"
      REPOSITORY_CLONE_TIMEOUT_SECONDS: "120"
      REPOSITORY_INSPECTION_TIMEOUT_SECONDS: "300"

    steps:
      - name: Download sanitized discovery artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dotnet-repository-discovery
          path: ${{ runner.temp }}/dotnet-repository-discovery

      - name: Validate inspection trust boundary
        shell: bash
        env:
          DISCOVERED_REPOSITORIES_FILE: ${{ runner.temp }}/dotnet-repository-discovery/repositories.json
        run: bash "$GITHUB_WORKSPACE/.github/scripts/automation/dotnet-inventory-trust-boundary.sh"
      - name: Checkout trusted inventory automation without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/automation

      - name: Checkout pinned DotNetRepoInspector without credentials
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/automation/dotnet-inventory-checkout-inspector.sh"
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build DotNetRepoInspector
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          INSPECTOR_PROJECT: ${{ github.workspace }}/.inspector/src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj
        run: bash "$GITHUB_WORKSPACE/.github/scripts/automation/dotnet-inventory-build-inspector.sh"
      - name: Generate .NET repository inventory
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          DISCOVERED_REPOSITORIES_FILE: ${{ runner.temp }}/dotnet-repository-discovery/repositories.json
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          INSPECTOR_PROJECT: ${{ github.workspace }}/.inspector/src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: bash "$GITHUB_WORKSPACE/.github/scripts/automation/dotnet-inventory-inspection.sh"
      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-repository-inventory
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
