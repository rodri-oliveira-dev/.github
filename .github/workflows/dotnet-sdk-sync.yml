name: Sync .NET SDK versions

on:
  schedule:
    # 09:00 America/Sao_Paulo (12:00 UTC), every Monday.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report available updates; do not create branches or PRs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dotnet-sdk-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Discover root global.json and open update PRs
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 90

    steps:
      - name: Checkout control-plane branch ownership policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOTNET_SDK_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOTNET_SDK_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Synchronize .NET SDK versions
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/automation/dotnet-sdk-sync.sh"
