name: Publish reusable workflow release

# Publication is privileged and must never run on an untrusted pull_request.
# A reviewed VERSION bump publishes only after it reaches main. Manual dispatch
# is retained for idempotent retry/recovery of the version declared on main.
on:
  push:
    branches:
      - main
    paths:
      - ".github/reusable-workflows/VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-reusable-workflow-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish reviewed control plane release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve reviewed release version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          version_file=".github/reusable-workflows/VERSION"
          [[ -s "$version_file" ]] || {
            echo "::error title=Reusable workflow release::Missing or empty $version_file."
            exit 1
          }

          version="$(cat "$version_file")"
          [[ "$version" =~ ^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error title=Reusable workflow release::$version_file must contain one canonical vMAJOR.MINOR.PATCH value."
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release request
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          bash -n .github/scripts/release-reusable-workflows.sh
          bash .github/scripts/release-reusable-workflows.sh --validate

      - name: Create immutable release and promote major alias
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          bash .github/scripts/release-reusable-workflows.sh
